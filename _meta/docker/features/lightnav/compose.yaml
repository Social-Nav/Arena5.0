services:
  lightnav:
    image: ${LIGHTNAV_IMAGE:-lightnav-inference:arena-497bebf}
    labels:
      arena.lightnav.source: ${LIGHTNAV_SOURCE_PATH:-/home/kaizhen/vln_ws/LightNav-0}
    init: true
    shm_size: 2gb
    ports:
      - "127.0.0.1:${LIGHTNAV_PORT:-8050}:8050"
    environment:
      MODEL_PATH: /models/LightNav-0
      TASK: vln
      BACKEND: vllm_local
      HOST: 0.0.0.0
      PORT: "8050"
      GPU_MEM_UTIL: "${LIGHTNAV_GPU_MEM_UTIL:-0.55}"
      VLN_KV_CACHE_GIB: "${LIGHTNAV_KV_CACHE_GIB:-2}"
      MAX_BATCH_SIZE: "1"
      MAX_WAIT_MS: "0"
      HF_HUB_OFFLINE: "1"
      HF_HOME: /home/appuser/.cache/huggingface
      XDG_CACHE_HOME: /home/appuser/.cache
      VLLM_CACHE_ROOT: /home/appuser/.cache/vllm
      TORCHINDUCTOR_CACHE_DIR: /home/appuser/.cache/torchinductor
      TRITON_CACHE_DIR: /home/appuser/.cache/triton
      CUDA_CACHE_PATH: /home/appuser/.cache/cuda
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OMP_NUM_THREADS: "8"
      OPENBLAS_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "localhost,127.0.0.1"
      no_proxy: "localhost,127.0.0.1"
    volumes:
      - type: bind
        source: ${LIGHTNAV_MODEL_PATH:-/media/kaizhen/data/vln_ws/LightNav-0/models/LightNav-0}
        target: /models/LightNav-0
        read_only: true
        bind:
          create_host_path: false
      - lightnav_cache:/home/appuser
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LIGHTNAV_GPU:-0}"]
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json; from websockets.sync.client import connect; w=connect('ws://127.0.0.1:8050',open_timeout=3); [(w.send(json.dumps({'action':a,'data':{}})),exit(1) if json.loads(w.recv(timeout=3))['data']['rc'] != 0 else None) for a in ['login','reset']]; w.close()"
      interval: 5s
      timeout: 10s
      start_period: 900s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  lightnav_cache:
    name: arena-arena_ws_lightnav_cache
    external: true
