services:
  arena:
    image: "${ARENA_IMAGE}"
    build:
      context: .
      dockerfile: src/Arena/_meta/docker/features/docker/Dockerfile
      args:
        - gid=${HOST_GID}
        - uid=${HOST_UID}
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/tmp/.X11-unix:/tmp/.X11-unix:rw"
      - "shared:/tmp/shared"
      - "$HOST_ARENA_WS_DIR/src/Arena/.venv:/opt/venv"
      - "$HOST_ARENA_WS_DIR/src:/opt/arena_ws/src"
      - "$HOST_ARENA_WS_DIR/build:/opt/arena_ws/build"
      - "$HOST_ARENA_WS_DIR/install:/opt/arena_ws/install"
      - "$HOST_ARENA_WS_DIR/log:/opt/arena_ws/log"
      - "$HOST_ARENA_WS_DIR/.env:/opt/arena_ws/.env"
      - "${HOST_SCENES_DIR:-/tmp/arena_scenes}:/data/scenes"
      - "${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent"
    environment:
      - QT_X11_NO_MITSHM=1
      - TMPDIR=/tmp/shared
      - DISPLAY
      - UV_LINK_MODE=copy
      - ARENA_IMAGE
      - ARENA_PROJECT_NAME
      - ARENA_ROS_DISTRO
      - HOST_UID
      - HOST_GID
      - HOST_ARENA_WS_DIR
      - SSH_AUTH_SOCK=/ssh-agent
    env_file:
      - "$HOST_ARENA_WS_DIR/.env"
    user: "${HOST_UID}"
    group_add:
      - sudo
    network_mode: host
    command: ["bash"]
    stdin_open: true 
    tty: true
    healthcheck:
      test: ["CMD", "test", "-f", "/.built"]
      interval: 1s
      timeout: 2s
      retries: 99999 # if you can't build by then, good juck
      start_period: 0s
    ports:
      - 50101
      - 50102

  isaac:
    image: "arena_isaac"
    build:
      context: .
      dockerfile: src/Arena/_meta/docker/features/isaac/Dockerfile
    network_mode: host
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/tmp/.X11-unix:/tmp/.X11-unix:rw"
      - "shared:/tmp/shared"
      - "$HOST_ARENA_WS_DIR/src/Arena/.venv:/opt/venv"
      - "$HOST_ARENA_WS_DIR/src:/opt/arena_ws/src"
      - "$HOST_ARENA_WS_DIR/build:/opt/arena_ws/build"
      - "$HOST_ARENA_WS_DIR/install:/opt/arena_ws/install"
      - "$HOST_ARENA_WS_DIR/log:/opt/arena_ws/log"
      - "$HOST_ARENA_WS_DIR/.env:/opt/arena_ws/.env"
      - "${HOST_SCENES_DIR:-/tmp/arena_scenes}:/data/scenes"
    # /dev/nvidia-modeset is NOT injected by the nvidia runtime here (only nvidia0/nvidiactl/uvm
    # are), but NVIDIA's Vulkan WSI needs it to enumerate X11 swapchain surface formats. Without
    # it, headless Isaac works fine while windowed startup dies in the renderer:
    #   "Failed to find device surface formats." -> "Failed to create a swapchain."
    #   -> free(): invalid pointer -> abort in libnvidia-glcore (vkGetPhysicalDeviceSurfaceFormats2KHR)
    # Verified: same crash from a bare `vulkaninfo` in this container, and both it and Isaac
    # windowed startup succeed as soon as this node is present.
    devices:
      - "/dev/nvidia-modeset:/dev/nvidia-modeset"
    environment:
      - DISPLAY
      - TMPDIR=/tmp/shared
      - QT_X11_NO_MITSHM=1
      - UV_LINK_MODE=copy
      - ARENA_IMAGE
      - ARENA_PROJECT_NAME
      - ARENA_ROS_DISTRO
      - HOST_UID
      - HOST_ARENA_WS_DIR
      - ROS_DOMAIN_ID=1
    stdin_open: true 
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

volumes:
  shared:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
