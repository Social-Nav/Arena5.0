services:
  arena:
    image: "${ARENA_IMAGE}"
    build:
      context: .
      dockerfile: src/Arena/_meta/docker/features/docker/Dockerfile
      network: host
      args:
        - gid=${HOST_GID}
        - uid=${HOST_UID}
        - APT_TIMEOUT_SEC=${APT_TIMEOUT_SEC:-3600}
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - http_proxy=${http_proxy:-}
        - https_proxy=${https_proxy:-}
        - ROS_APT_MIRROR=${ROS_APT_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/ros2/ubuntu}
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/tmp/.X11-unix:/tmp/.X11-unix:rw"
      - "shared:/tmp/shared"
      - "${HOME}/.ssh:/home/arena/.ssh:ro"
      - "$HOST_ARENA_WS_DIR:$HOST_ARENA_WS_DIR"
      - "$HOST_ARENA_WS_DIR/src/Arena/.venv:/opt/venv"
      - "$HOST_ARENA_WS_DIR/src:/opt/arena_ws/src"
      - "$HOST_ARENA_WS_DIR/deps:/opt/arena_ws/deps"
      - "$HOST_ARENA_WS_DIR/outputs:/opt/arena_ws/outputs"
      - "$HOST_ARENA_WS_DIR/build:/opt/arena_ws/build"
      - "$HOST_ARENA_WS_DIR/install:/opt/arena_ws/install"
      - "$HOST_ARENA_WS_DIR/log:/opt/arena_ws/log"
      - "$HOST_ARENA_WS_DIR/.env:/opt/arena_ws/.env"
      - "${HOST_SCENES_DIR:-/tmp/arena_scenes}:/data/scenes"
    environment:
      - QT_X11_NO_MITSHM=1
      - TMPDIR=/tmp/shared
      - DISPLAY
      - UV_LINK_MODE=copy
      - UV_NO_PROGRESS=1
      - UV_HTTP_TIMEOUT
      - UV_CONCURRENT_DOWNLOADS
      - UV_INDEX_URL
      - ARENA_IMAGE
      - ARENA_PROJECT_NAME
      - ARENA_ROS_DISTRO
      - ARENA_UV_SYNC_TIMEOUT_SEC
      - ARENA_APT_UPDATE_TIMEOUT_SEC
      - ARENA_SKIP_APT_UPDATE
      - ARENA_VCSTOOL_UPDATE_TIMEOUT_SEC
      - ARENA_SKIP_VCSTOOL_UPDATE
      - HTTP_PROXY
      - HTTPS_PROXY
      - NO_PROXY
      - http_proxy
      - https_proxy
      - no_proxy
      - HOST_UID
      - HOST_GID
      - HOST_DOCKER_GID
      - HOST_ARENA_WS_DIR
    env_file:
      - "$HOST_ARENA_WS_DIR/.env"
    user: "${HOST_UID}"
    group_add:
      - sudo
      - "${HOST_DOCKER_GID}"
    network_mode: host
    command: ["bash"]
    stdin_open: true 
    tty: true
    healthcheck:
      test: ["CMD", "test", "-f", "/.built"]
      interval: 1s
      timeout: 2s
      retries: 99999 # if you can't build by then, good juck
      start_period: 0s
    ports:
      - 50101
      - 50102

  isaac:
    image: "arena_isaac"
    build:
      context: .
      dockerfile: src/Arena/_meta/docker/features/isaac/Dockerfile
      network: host
      args:
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - NO_PROXY=${NO_PROXY:-}
        - http_proxy=${http_proxy:-}
        - https_proxy=${https_proxy:-}
        - no_proxy=${no_proxy:-}
        - ROS_APT_MIRROR=${ROS_APT_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/ros2/ubuntu}
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/tmp/.X11-unix:/tmp/.X11-unix:rw"
      - "shared:/tmp/shared"
      - "${HOME}/.ssh:/home/arena/.ssh:ro"
      - "$HOST_ARENA_WS_DIR:$HOST_ARENA_WS_DIR"
      - "$HOST_ARENA_WS_DIR/src/Arena/.venv:/opt/venv"
      - "$HOST_ARENA_WS_DIR/src:/opt/arena_ws/src"
      - "$HOST_ARENA_WS_DIR/deps:/opt/arena_ws/deps"
      - "$HOST_ARENA_WS_DIR/outputs:/opt/arena_ws/outputs"
      - "$HOST_ARENA_WS_DIR/build:/opt/arena_ws/build"
      - "$HOST_ARENA_WS_DIR/install:/opt/arena_ws/install"
      - "$HOST_ARENA_WS_DIR/log:/opt/arena_ws/log"
      - "$HOST_ARENA_WS_DIR/.env:/opt/arena_ws/.env"
      - "${HOST_SCENES_DIR:-/tmp/arena_scenes}:/data/scenes"
      - "$HOST_ARENA_WS_DIR/.docker/isaac/cache/kit:/isaac-sim/kit/cache"
      - "$HOST_ARENA_WS_DIR/.docker/isaac/cache/ov:/root/.cache/ov"
      - "$HOST_ARENA_WS_DIR/.docker/isaac/cache/pip:/root/.cache/pip"
      - "$HOST_ARENA_WS_DIR/.docker/isaac/cache/glcache:/root/.cache/nvidia/GLCache"
      - "$HOST_ARENA_WS_DIR/.docker/isaac/cache/computecache:/root/.nv/ComputeCache"
      - "$HOST_ARENA_WS_DIR/.docker/isaac/data:/root/.local/share/ov/data"
      - "$HOST_ARENA_WS_DIR/.docker/isaac/documents:/root/Documents"
      - "$HOST_ARENA_WS_DIR/.docker/isaac/logs:/root/.nvidia-omniverse/logs"
    environment:
      - DISPLAY
      - TMPDIR=/tmp/shared
      - QT_X11_NO_MITSHM=1
      - UV_LINK_MODE=copy
      - UV_NO_PROGRESS=1
      - UV_HTTP_TIMEOUT
      - UV_CONCURRENT_DOWNLOADS
      - UV_INDEX_URL
      - ARENA_IMAGE
      - ARENA_PROJECT_NAME
      - ARENA_ROS_DISTRO
      - ARENA_UV_SYNC_TIMEOUT_SEC
      - ARENA_APT_UPDATE_TIMEOUT_SEC
      - ARENA_SKIP_APT_UPDATE
      - ARENA_VCSTOOL_UPDATE_TIMEOUT_SEC
      - ARENA_SKIP_VCSTOOL_UPDATE
      - HTTP_PROXY
      - HTTPS_PROXY
      - NO_PROXY
      - http_proxy
      - https_proxy
      - no_proxy
      - HOST_UID
      - HOST_ARENA_WS_DIR
      - ROS_DOMAIN_ID=1
    stdin_open: true 
    tty: true
    network_mode: host
    gpus: all

volumes:
  shared:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
