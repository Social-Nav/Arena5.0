site_name: Arena Benchmark
site_description: Model integration and evaluation with Arena, Docker, Isaac Sim, and native FollowPath.
site_url: https://social-nav.github.io/Arena5.0/
repo_url: https://github.com/Social-Nav/Arena5.0
repo_name: Social-Nav/Arena5.0
theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - content.code.copy
nav:
  - Home: index.md
  - Installation: installation.md
  - 模型接入与评估: Model_Evaluation.md
  - Artifacts and Validation: benchmark/outputs-and-metrics.md
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
