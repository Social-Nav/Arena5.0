site_name: Arena Benchmark
site_description: Minimal documentation for the current Docker, Isaac Sim, and InternNav benchmark flow.
site_url: https://social-nav.github.io/Arena5.0/
repo_url: https://github.com/Social-Nav/Arena5.0
repo_name: Social-Nav/Arena5.0
theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - content.code.copy
nav:
  - Home: index.md
  - Installation: installation.md
  - Benchmark:
      - Run Current Benchmarks: benchmark/running-benchmarks.md
      - Camera Backends and TF: benchmark/camera-backends.md
      - Runtime Source Binding Gate: benchmark/source-binding-gate.md
      - Artifacts and Validation: benchmark/outputs-and-metrics.md
      - ProxMPC A-Track Runbook: benchmark/prox_mpc_a_track_runbook.md
      - Paper Pipeline Coverage: benchmark/paper_pipeline_coverage.md
      - Agentic Evaluation Contract: benchmark/agentic_eval.md
      - Troubleshooting: benchmark/troubleshooting.md
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
