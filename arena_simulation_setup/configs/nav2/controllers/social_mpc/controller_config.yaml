controller_plugins:
  - FollowPath
controller_plugins_dict:
  FollowPath:
    plugin: "nav2_social_mpc_controller::SocialMPCController"
    transform_tolerance: 0.5
    trajectorizer:
      omnidirectional: false
      desired_linear_vel: ${max_vel_x:-0.6}
      lookahead_dist: 2.0
      max_angular_vel: 1.4
      base_frame: "${frame:-}${robot_base_frame:-base_link}"
      time_step: 0.05
      max_time: 1.5
    optimizer:
      linear_solver_type: "DENSE_SCHUR"
      param_tol: 1.0e-9
      fn_tol: 1.0e-5
      gradient_tol: 1.0e-8
      max_iterations: 40
      control_horizon: 18
      parameter_block_length: 6
      discretization: 1
      debug_optimizer: false
      current_path_weight: 1.0
      current_cmds_weight: 0.5
      weights:
        distance_weight: 80.0
        social_weight: 80.0
        velocity_weight: 30.0
        angle_weight: 200.0
        agent_angle_weight: 20.0
        velocity_feasibility_weight: 5.0
        goal_align_weight: 10.0
        obstacle_weight: 0.13
