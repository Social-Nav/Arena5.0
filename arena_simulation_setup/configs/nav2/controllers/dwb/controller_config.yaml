controller_plugins:
  - FollowPath
controller_plugins_dict:
  FollowPath:
    plugin: "dwb_core::DWBLocalPlanner"
    debug_trajectory_details: True
    min_vel_x: 0.0
    min_vel_y: 0.0
    max_vel_x: ${max_vel_x:-0.22}
    max_vel_y: 0.0
    max_vel_theta: ${max_vel_theta:-0.45}
    min_speed_xy: 0.0
    max_speed_xy: ${max_speed_xy:-0.22}
    min_speed_theta: 0.0
    acc_lim_x: 0.8
    acc_lim_y: 0.0
    acc_lim_theta: 0.8
    decel_lim_x: -0.8
    decel_lim_y: 0.0
    decel_lim_theta: -1.0
    vx_samples: 20
    vy_samples: 5
    vtheta_samples: 30
    sim_time: 1.2
    linear_granularity: 0.05
    angular_granularity: 0.02
    transform_tolerance: 0.2
    xy_goal_tolerance: 0.25
    trans_stopped_velocity: 0.05
    short_circuit_trajectory_evaluation: True
    stateful: True
    critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
    BaseObstacle.scale: 0.10
    PathAlign.scale: 20.0
    PathAlign.forward_point_distance: 0.1
    GoalAlign.scale: 16.0
    GoalAlign.forward_point_distance: 0.1
    PathDist.scale: 20.0
    GoalDist.scale: 18.0
    RotateToGoal.scale: 32.0 #original: 32.0
    RotateToGoal.slowing_factor: 8.0
    RotateToGoal.lookahead_time: -1.0