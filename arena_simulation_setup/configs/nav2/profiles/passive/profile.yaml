# Robot social profile: PASSIVE -- the most cautious of the three. Wide bubble, slow cruise, so
# the robot decelerates and lets pedestrians pass. Must be requested explicitly: a scenario
# without `social_attributes` now gets ../neutral, because passive brakes too early and too often
# to serve as an interaction baseline.
#
# Siblings: ../neutral (midway), ../aggressive. All three must define the SAME keys.
# Parameter reference, rules and the side-by-side comparison: docs/场景与社交配置说明.md

weights:
  social_weight: 700.0
  proxemics_weight: 150.0         # bubble strength
  proxemics_d0: 0.8               # bubble range (~1 m standoff)
  proxemics_alpha: 3.0
  social_clear_distance: 2.0      # hard cutoff: peds beyond this are skipped entirely
  social_safety_distance: 1.0
  social_mid_gain: 1.0
  social_near_gain: 6.0

weights_optimizer:
  max_linear_velocity: 0.7        # hard vx CEILING, not the cruise speed

trajectorizer:
  desired_linear_vel: 0.5        # the real speed knob (social_mpc ignores max_vel_x)
