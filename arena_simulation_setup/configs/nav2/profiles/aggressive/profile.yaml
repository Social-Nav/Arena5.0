# Robot social profile: AGGRESSIVE -- holds its line, keeps a smaller gap, full cruise speed.
# Deltas vs passive (the baseline) are LOCAL only: MPC critics + cruise speed. The global costmap
# bubbles are identical, so navfn plans the same courteous route in both profiles.
#
# Siblings: ../passive (baseline), ../neutral (midway). All three must define the SAME keys.
# Parameter reference and rules: docs/场景与社交配置说明.md

weights:
  social_weight: 400.0            # 700->400
  proxemics_weight: 70.0          # 150->70: weak personal-space repulsion
  proxemics_d0: 0.5               # 1.0->0.6: tight bubble (~0.9 m effective)
  proxemics_alpha: 3.0
  social_clear_distance: 1.0      # 2.0->1.0: Hard cutoff, so keep it wide and the gains weak.
  social_safety_distance: 0.5    # 0.9->0.75. Also the ramp denominator (clear - safety).
  social_mid_gain: 1.0
  social_near_gain: 4.0           # 6.0->4.0

weights_optimizer:
  max_linear_velocity: 0.8        # hard vx CEILING, not the cruise speed

trajectorizer:
  desired_linear_vel: 0.8         # 0.55->0.8: cruise at the ceiling (smoother + Ceres both cap 0.8)
