amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: ${frame:-}${robot_base_frame:-base_link}
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: ${frame:-}${robot_odom_frame:-odom}
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: ${frame:-}${robot_base_frame:-base_link}
    odom_topic: ${robot_odom_frame:-odom}
    enable_groot_monitoring: True
    groot_zmq_publisher_port: 1666
    bt_loop_duration: 100
    groot_zmq_server_port: 1667
    action_server_timeout: 0.0
    retry_max: 5
    retry_timeout: 0.0
    wait_for_service_timeout: -1
    
    default_nav_to_pose_bt_xml: ${default_nav_to_pose_bt_xml}
    default_nav_through_poses_bt_xml: ${default_nav_through_poses_bt_xml}

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    costmap_update_timeout: 2.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "goal_checker"
    always_reset_odom: true
    require_costmap_update_before_planning: false
    
    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 60.0
    
    # Goal checker parameters
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 3.14
      stateful: True

    controller_plugins: ${controller_plugins}
    '${**controller_plugins_dict}': ''

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: ${frame:-}${robot_base_frame:-base_link}
    fixed_frame: ${frame:-}${robot_odom_frame:-odom}
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 10.0
      global_frame: ${frame:-}${robot_odom_frame:-odom}
      robot_base_frame: ${frame:-}${robot_base_frame:-base_link}
      use_sim_time: True
      transform_tolerance: 0.5
      rolling_window: true
      width: 15
      height: 15
      resolution: 0.1
      footprint: ${footprint}
      footprint_padding: 0.05
      # dual_vln currently relies on the global route + model/heuristic control;
      # Isaac fallback scans can be published before all TF/costmap timestamps
      # settle, which makes the voxel layer repeatedly reject sensor origins and
      # delays controller startup.  Keep the local costmap lightweight for this
      # eval path.
      plugins: ["static_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: ${observation_sources_string}
        ${**observation_sources_dict}: ''
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: ${task_generator_node}/map
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: ${frame:-}${robot_base_frame:-base_link}
      use_sim_time: True
      transform_tolerance: 0.5
      footprint: ${footprint}
      resolution: 0.05
      # The global costmap must cover the whole static map.  hospital_1 spans
      # roughly x=[-0.25,25.25], y=[-0.25,34.45]; the old fixed 20m window
      # centered at the origin clipped valid goals such as (18.2, 5.0), causing
      # NavFn to abort with "failed to create plan" even though the map was
      # loaded correctly.
      width: 40
      height: 45
      origin_x: -5.0
      origin_y: -5.0
      track_unknown_space: true
      rolling_window: false
      # For VLN evaluation the global planner is used only to provide a coarse
      # route/subgoal.  Keep the global costmap permissive and map-only; local
      # safety remains in the local costmap / controller.  The inflated global
      # map can mark valid hospital_1 reset poses as occupied and prevents NavFn
      # from ever handing control to dual_vln.
      plugins: ["static_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: ${observation_sources_string}
        ${**observation_sources_dict}: ''
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: ${task_generator_node}/map
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: True
    autostart: True
    bond_timeout: 0.0

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ''
    topic_name: "/map"
    frame_id: "map"

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    expected_update_rate: 1.0
    use_sim_time: True
    planner_plugins: ${planner_plugins}
    '${**planner_plugins_dict}': ''


planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    recovery_plugins: ["spin", "back_up", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    back_up:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: map
    robot_base_frame: ${frame:-}${robot_base_frame:-base_link}
    transform_timeout: 0.0
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.1
    rotational_acc_lim: 3.2

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: map
    robot_base_frame: ${frame:-}${robot_base_frame:-base_link}
    transform_timeout: 0.0
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.1
    rotational_acc_lim: 3.2

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.22, 0.0, 0.8]
    min_velocity: [-0.22, 0.0, -0.8]
    max_accel: [0.8, 0.0, 1.2]
    max_decel: [-0.8, 0.0, -1.2]
    odom_topic: ${namespace}/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.2

collision_monitor:
  ros__parameters:
    enabled: true

    observation_sources: ${observation_sources}
    ${**observation_sources_dict}: ''
    polygons: ${polygons}
    ${**polygons_dict}: ''


    # 1) TF frames
    base_frame_id: ${frame:-}${robot_base_frame:-base_link}
    odom_frame_id: ${frame:-}${robot_odom_frame:-odom}

    # 2) Velocity topics
    # Full chain: controller_server → "cmd_vel_nav" → velocity_smoother → "cmd_vel_smoothed" → collision_monitor → "cmd_vel"
    cmd_vel_in_topic:  "cmd_vel_smoothed"
    cmd_vel_out_topic: "${cmd_vel_out_topic:-cmd_vel}"

    # 3) Timers & lifecycles
    use_sim_time:         true
    source_timeout:       0.2
    stop_pub_timeout:     0.2
    transform_tolerance:  0.2
    base_shift_correction: true


    # 4) QoS overrides 
    allow_parameter_qos_overrides: true
    qos_overrides:
      /tf_static:
        subscription:
          durability: transient_local
          reliability: reliable
          history: keep_last
          depth: 1
    #   /tf:
    #     subscription:
    #       durability: volatile
    #       reliability: best_effort
    #       history: keep_last
    #       depth: 100
      






# ### ekf config file ###
# ekf_node:
#     ros__parameters:
# # The frequency, in Hz, at which the filter will output a position estimate. Note that the filter will not begin
# # computation until it receives at least one message from one of the inputs. It will then run continuously at the
# # frequency specified here, regardless of whether it receives more measurements. Defaults to 30 if unspecified.
#         frequency: 30.0

# # ekf_localization_node and ukf_localization_node both use a 3D omnidirectional motion model. If this parameter is
# # set to true, no 3D information will be used in your state estimate. Use this if you are operating in a planar
# # environment and want to ignore the effect of small variations in the ground plane that might otherwise be detected
# # by, for example, an IMU. Defaults to false if unspecified.
#         two_d_mode: false

# # Whether to publish the acceleration state. Defaults to false if unspecified.
#         publish_acceleration: true

# # Whether to broadcast the transformation over the /tf topic. Defaults to true if unspecified.
#         publish_tf: true

# # 1. Set the map_frame, odom_frame, and base_link frames to the appropriate frame names for your system.
# #     1a. If your system does not have a map_frame, just remove it, and make sure "world_frame" is set to the value of odom_frame.
# # 2. If you are fusing continuous position data such as wheel encoder odometry, visual odometry, or IMU data, set "world_frame"
# #    to your odom_frame value. This is the default behavior for robot_localization's state estimation nodes.
# # 3. If you are fusing global absolute position data that is subject to discrete jumps (e.g., GPS or position updates from landmark
# #    observations) then:
# #     3a. Set your "world_frame" to your map_frame value
