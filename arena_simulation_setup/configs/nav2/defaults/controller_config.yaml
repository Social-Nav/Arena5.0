FollowPath:
  critics: ${critics}
  ${**critics_dict}: ''

critics: [
  "ConstraintCritic",
  "CostCritic",
  "GoalCritic",
  "GoalAngleCritic",
  "PathAlignCritic",
  "PathFollowCritic",
  "PathAngleCritic",
  "PreferForwardCritic",
]
critics_dict:
  ConstraintCritic:
    enabled: true
    cost_power: 1
    cost_weight: 4.0
  GoalCritic:
    enabled: true
    cost_power: 1
    cost_weight: 5.0
    threshold_to_consider: 1.4
  GoalAngleCritic:
    enabled: true
    cost_power: 1
    cost_weight: 3.0
    threshold_to_consider: 0.5
  PreferForwardCritic:
    enabled: true
    cost_power: 1
    cost_weight: 5.0
    threshold_to_consider: 0.5
  CostCritic:
    enabled: true
    cost_power: 1
    cost_weight: 3.81
    near_collision_cost: 253
    critical_cost: 300.0
    consider_footprint: true # original: false
    collision_cost: 1000000.0
    near_goal_distance: 1.0
    trajectory_point_step: 2
  PathAlignCritic:
    enabled: true
    cost_power: 1
    cost_weight: 14.0
    max_path_occupancy_ratio: 0.05
    trajectory_point_step: 4
    threshold_to_consider: 0.5
    offset_from_furthest: 20
    use_path_orientations: false
  PathFollowCritic:
    enabled: true
    cost_power: 1
    cost_weight: 5.0
    offset_from_furthest: 5
    threshold_to_consider: 1.4
  PathAngleCritic:
    enabled: true
    cost_power: 1
    cost_weight: 2.0
    offset_from_furthest: 4
    threshold_to_consider: 0.5
    max_angle_to_furthest: 1.0
    mode: 0
  # TwirlingCritic:
