/**:
  ros__parameters:
    # GRScenes-style USD composition can take several minutes in Isaac Sim.
    # Keep navigation readiness barriers long enough to wait for real scene,
    # TF, odom, and camera topics instead of racing goal publication.
    episode_navigation_ready_timeout_sec: 900.0
    world_geometry_ready_timeout_sec: 600.0
    task:
      parametrized:
        file: default.xml
      random:
        dynamic:
          n: [0, 0]
          models:
          - gazebo_actor
        interactive:
          n: [0, 0]
          models:
          - shelf
        static:
          n: [0, 0]
          models:
          - shelf
        seed: -1
      scenario:
        file: default
      staged:
        curriculum: default.yaml
        index: 0
      environment:
        file: office.yaml
    hunavsim:       
      parameters:
        max_vel: 0.3
        force_factor_desired: 1.0
        force_factor_obstacle: 1.0
        force_factor_social: 5.0
        force_factor_robot: 0.0
