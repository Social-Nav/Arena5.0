id: 1
group_id: -1
skin: 0
max_vel: 0.8
radius: 0.3
goal_radius: 0.2
# Legacy spelling, still honoured.  `false` = walk waypoint 0 -> N once and stop;
# `true` = return to waypoint 0 and repeat in the same direction.
cyclic_goals: false
# How pedestrians consume their waypoint list.  Takes precedence over
# `cyclic_goals` above when both are set.  One of:
#   once        walk 0 -> N, then stop            (default; == cyclic_goals: false)
#   cyclic      walk 0 -> N, return to 0, repeat  (== cyclic_goals: true)
#   reciprocate walk 0 -> N -> 0 -> N, forever    (ping-pong)
# `reciprocate` keeps pedestrians moving for the whole episode instead of the
# 0.9-6% measured with `once`, which CHANGES SCENE DYNAMICS: social metrics from
# a `reciprocate` run are not comparable with those from an `once` run.  The
# effective mode is recorded in the run manifest so a future reader can tell
# which regime produced a number.  A run-level override is available as the
# `pedestrian_goal_traversal` launch argument.
goal_traversal: once
init_pose:
  x: 0.0
  y: 0.0
  z: 1.250
  h: 0.0
behavior:
  type: 1 # hunav_msgs::msg::BEH_REGULAR
  configuration: 0
  goal_force_factor: 5.0
  obstacle_force_factor: 2.0
  social_force_factor: 10.0
  other_force_factor: 20.0
